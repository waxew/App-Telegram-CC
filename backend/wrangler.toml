# =============================================================================
# تنظیمات Cloudflare Worker برای هستهٔ فروشگاه‌ساز تلگرام.
# هیچ Secret واقعی در این فایل قرار نمی‌گیرد.
# =============================================================================
name = "app-telegram-cc"
main = "src/index.js"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
PROJECT_NAME = "App Telegram CC"

# -----------------------------------------------------------------------------
# دیتابیس اختصاصی همین پروژه.
# SUPABASE_URL یک آدرس عمومی است و Secret محسوب نمی‌شود؛ بنابراین عمداً اینجا
# ثابت شده تا Worker این پروژه هیچ‌وقت به دیتابیس پروژه‌هایی مثل ai-panel وصل نشود.
# کلید پرقدرت SUPABASE_SERVICE_ROLE_KEY همچنان فقط به‌صورت Cloudflare Secret
# نگهداری می‌شود و هرگز نباید در این فایل یا سورس Android قرار بگیرد.
# -----------------------------------------------------------------------------
SUPABASE_URL = "https://hovjhysmghcuxbknpvmr.supabase.co"
SUPABASE_PROJECT_REF = "hovjhysmghcuxbknpvmr"

# اطلاعات عمومی کنترل نسخهٔ اپ. URL دانلود بعد از ساخت Release عمومی GitHub
# به آدرس Asset امضاشده تغییر می‌کند؛ تا آن زمان خالی بودن آن مانع کار اپ نیست.
ANDROID_LATEST_VERSION_CODE = "2"
ANDROID_LATEST_VERSION_NAME = "1.1.0"
ANDROID_DOWNLOAD_URL = ""
ANDROID_FORCE_UPDATE = "false"
