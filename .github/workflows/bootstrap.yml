# One-time workflow used only to restore the initial source snapshot.
name: Bootstrap source snapshot

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project and publish source tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap-xz.part-* | base64 -d > /tmp/project.tar.xz
          tar -xJf /tmp/project.tar.xz -C .
          rm -f bootstrap-xz.part-* bootstrap-content.part-00
          # Workflow files are added separately through the GitHub connector because
          # GITHUB_TOKEN cannot create new workflow files without workflows permission.
          rm -f .github/workflows/android-ci.yml .github/workflows/backend-ci.yml
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Android management app and secure Telegram backend"
          git push origin HEAD:main
