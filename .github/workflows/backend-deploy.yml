# =============================================================================
# انتشار Production بک‌اند App-Telegram-CC روی Cloudflare Workers.
#
# این Workflow فقط دستی اجرا می‌شود. برای فلو فعلی برنامه که کاربر مستقیماً
# BotFather Token خودش را داخل APK وارد می‌کند، فقط Secretهای ضروری همان فلو
# الزامی هستند. Secretهای مربوط به Master Bot/PIN/Setup قدیمی اختیاری‌اند و
# نباید جلوی انتشار Backend اصلی اپ را بگیرند.
# =============================================================================
name: Backend Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    environment: production

    steps:
      # دریافت دقیق Commit انتخاب‌شده برای انتشار.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Runtime بک‌اند طبق package.json روی Node.js 22 است.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # نصب Dependencyهای Backend.
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      # جلوگیری از انتشار کد دارای خطای Syntax.
      - name: Check JavaScript syntax
        working-directory: backend
        run: npm run check

      # اجرای تست‌های امنیتی و پیکربندی قبل از Deploy.
      - name: Run backend tests
        working-directory: backend
        run: npm test

      # فقط چهار Secret زیر برای فلو اتصال مستقیم APK اجباری‌اند:
      # 1) احراز هویت GitHub Actions نزد Cloudflare
      # 2) تعیین Account مقصد در Cloudflare
      # 3) دسترسی Server-only به دیتابیس اختصاصی db_tel_cc
      # 4) AES-256-GCM برای رمزگذاری BotFather Tokenها
      - name: Verify direct-app production secrets exist
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            SUPABASE_SERVICE_ROLE_KEY
            TOKEN_ENCRYPTION_KEY
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: ${name}"
              exit 1
            fi
          done

      # Wrangler Action رسمی Cloudflare، Secretهای Runtime لازم برای فلو APK را
      # روی Worker ثبت می‌کند و سپس کد پوشه backend را منتشر می‌کند.
      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          wranglerVersion: "4.125.0"
          command: deploy
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            TOKEN_ENCRYPTION_KEY
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
