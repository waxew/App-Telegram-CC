# =============================================================================
# Workflow موقت توسعه: اجرای Patch هماهنگ مدیریت کامل محصولات Android.
# منطق Patch در فایل Python مستقل است تا YAML ساده و قابل اطمینان بماند.
# بعد از اجرای موفق، Workflow/Trigger/Script حذف می‌شوند.
# =============================================================================
name: Apply product management

on:
  push:
    branches: ["main"]
    paths:
      - ".github/commands/apply-product-management"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply coordinated Android product-management patch
        run: python3 .github/scripts/apply-product-management.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Show patch summary
        run: git diff --stat

      - name: Commit product management
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ir/asteam/telegramcc/data/ApiClient.kt \
                  app/src/main/java/ir/asteam/telegramcc/ui/AppViewModel.kt \
                  app/src/main/java/ir/asteam/telegramcc/ui/TelegramCcApp.kt
          git commit -m "Connect full Android product management"
          git push origin HEAD:main
