# =============================================================================
# CI Android: روی هر Push/PR تست‌ها، APK دیباگ، APK Release unsigned، بستهٔ سورس
# و ابزار رسمی امضای Android Build Tools را می‌سازد/آرشیو می‌کند.
#
# Keystore خصوصی هرگز وارد CI عمومی یا Repository نمی‌شود. ابزارهای apksigner و
# zipalign عمومی‌اند و فقط برای امضای Release با کلید پایدار خارج از Repo خروجی
# گرفته می‌شوند.
# =============================================================================
name: Android CI

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # سورس دقیق همان Commit را دریافت می‌کنیم.
      - name: Checkout repository
        uses: actions/checkout@v4

      # ساخت Android این پروژه روی JDK 17 استاندارد شده است.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK و API مورد نیاز نصب می‌شوند.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Gradle به‌صورت صریح پین شده تا Build بین Runnerها تکرارپذیر باشد.
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # تست واحد + ساخت هر دو Variant. Release در CI عمومی بدون Secret عمداً unsigned است.
      - name: Run tests and build APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      # نام فایل‌ها را برای تحویل خواناتر می‌کنیم و ابزار رسمی Signing را از همان
      # Build Tools که APK با آن ساخته شده است کنار Artifactها قرار می‌دهیم.
      - name: Prepare deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables/android-signing-tools/lib deliverables/android-signing-tools/lib64
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/App-Telegram-CC-v1.1.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk deliverables/App-Telegram-CC-v1.1.0-release-unsigned.apk
          git archive --format=zip --output=deliverables/source.App-Telegram-CC-v1.1.0.zip HEAD

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          cp "$BUILD_TOOLS/apksigner" deliverables/android-signing-tools/apksigner
          cp "$BUILD_TOOLS/lib/apksigner.jar" deliverables/android-signing-tools/lib/apksigner.jar
          cp "$BUILD_TOOLS/zipalign" deliverables/android-signing-tools/zipalign
          cp "$BUILD_TOOLS/lib64/libc++.so" deliverables/android-signing-tools/lib64/libc++.so
          chmod +x deliverables/android-signing-tools/apksigner deliverables/android-signing-tools/zipalign

          sha256sum deliverables/*.apk deliverables/*.zip > deliverables/SHA256SUMS.txt
          sha256sum deliverables/android-signing-tools/apksigner \
                    deliverables/android-signing-tools/lib/apksigner.jar \
                    deliverables/android-signing-tools/zipalign \
                    deliverables/android-signing-tools/lib64/libc++.so \
                    > deliverables/android-signing-tools/SHA256SUMS.txt

      # Debug برای QA روی دستگاه واقعی نگهداری می‌شود.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Telegram-CC-v1.1.0-debug
          path: deliverables/App-Telegram-CC-v1.1.0-debug.apk
          if-no-files-found: error

      # Release unsigned برای امضای پایدار خارج از Repository عمومی خروجی می‌شود.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Telegram-CC-v1.1.0-release-unsigned
          path: deliverables/App-Telegram-CC-v1.1.0-release-unsigned.apk
          if-no-files-found: error

      # بسته سورس و checksumها برای آرشیو نسخه تولید می‌شوند.
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: App-Telegram-CC-v1.1.0-source
          path: |
            deliverables/source.App-Telegram-CC-v1.1.0.zip
            deliverables/SHA256SUMS.txt
          if-no-files-found: error

      # ابزارهای رسمی عمومی Android برای zipalign، امضا و Verify خروجی Release.
      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Tools-36-signing-tools
          path: deliverables/android-signing-tools
          if-no-files-found: error
