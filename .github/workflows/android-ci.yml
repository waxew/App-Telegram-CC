# =============================================================================
# CI Android: روی هر Push/PR سورس Kotlin را Build و APK دیباگ را Artifact می‌کند.
# =============================================================================
name: Android CI

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete Compose weight import
        if: github.event_name == 'push'
        shell: bash
        run: |
          sed -i '/import androidx.compose.foundation.layout.weight/d' app/src/main/java/ir/asteam/telegramcc/ui/TelegramCcApp.kt
          if ! git diff --quiet -- app/src/main/java/ir/asteam/telegramcc/ui/TelegramCcApp.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/ir/asteam/telegramcc/ui/TelegramCcApp.kt
            git commit -m "Fix Compose RowScope weight import [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests and build debug APK
        id: gradle_build
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Save concise failure log
        if: failure() && steps.gradle_build.outputs.exit_code != '0'
        shell: bash
        run: |
          tail -n 300 android-build.log > ANDROID_BUILD_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ANDROID_BUILD_FAILURE.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture Android build failure [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-Telegram-CC-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
