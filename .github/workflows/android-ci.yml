# =============================================================================
# CI Android: روی هر Push/PR تست‌ها، APK دیباگ، APK Release unsigned و بستهٔ سورس
# را می‌سازد. Release نهایی بعد از دانلود Artifact با کلید پایدار پروژه امضا می‌شود.
# =============================================================================
name: Android CI

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # سورس دقیق همان Commit را دریافت می‌کنیم.
      - name: Checkout repository
        uses: actions/checkout@v4

      # ساخت Android این پروژه روی JDK 17 استاندارد شده است.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK و API مورد نیاز نصب می‌شوند.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Gradle به‌صورت صریح پین شده تا Build بین Runnerها تکرارپذیر باشد.
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # تست واحد + ساخت هر دو Variant. Release در CI عمومی بدون Secret عمداً unsigned است.
      - name: Run tests and build APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      # نام فایل‌ها را برای تحویل خواناتر می‌کنیم.
      - name: Prepare deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/App-Telegram-CC-v1.1.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk deliverables/App-Telegram-CC-v1.1.0-release-unsigned.apk
          git archive --format=zip --output=deliverables/source.App-Telegram-CC-v1.1.0.zip HEAD
          sha256sum deliverables/*.apk deliverables/*.zip > deliverables/SHA256SUMS.txt

      # Debug برای QA روی دستگاه واقعی نگهداری می‌شود.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Telegram-CC-v1.1.0-debug
          path: deliverables/App-Telegram-CC-v1.1.0-debug.apk
          if-no-files-found: error

      # Release unsigned برای امضای پایدار خارج از Repository عمومی خروجی می‌شود.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Telegram-CC-v1.1.0-release-unsigned
          path: deliverables/App-Telegram-CC-v1.1.0-release-unsigned.apk
          if-no-files-found: error

      # بسته سورس و checksumها برای آرشیو نسخه تولید می‌شوند.
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: App-Telegram-CC-v1.1.0-source
          path: |
            deliverables/source.App-Telegram-CC-v1.1.0.zip
            deliverables/SHA256SUMS.txt
          if-no-files-found: error
