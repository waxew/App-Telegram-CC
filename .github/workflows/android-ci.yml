# =============================================================================
# CI Android: روی هر Push/PR سورس Kotlin را Build و APK دیباگ را Artifact می‌کند.
# =============================================================================
name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Telegram-CC-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
